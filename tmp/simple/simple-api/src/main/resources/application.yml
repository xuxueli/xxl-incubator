server:
  # 后端服务端口
  port: 8080
  servlet:
    # Session Cookie 配置
    session:
      cookie:
        name: SIMPLE_SESSION_ID  # Cookie 名称
        http-only: true           # 禁止 JS 读取，防止 XSS
        secure: false             # 开发环境使用 HTTP，生产环境应设为 true
        max-age: 86400            # Cookie 有效期 24 小时

# Spring MVC 配置
spring:
  mvc:
    servlet:
      load-on-startup: 0
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/
    error:
      whitelabel:
        enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
