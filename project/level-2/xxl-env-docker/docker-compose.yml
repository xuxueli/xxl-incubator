# docker-compose version
version: '3.8'

services:

  # ==================== 核心存储 ====================
  mysql:
    image: mysql:8.4
    container_name: xxl-env-mysql
    environment:
      # 数据库设置：密码、数据库实例名称、时区等；
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xxl_boot
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据库初始化脚本：仅数据库首次初始化时执行；
      - ../../doc/db/tables_xxl_boot.sql:/docker-entrypoint-initdb.d/tables_xxl_boot.sql:ro
      - ../../doc/db/tables_xxl_boot_modular_vue.sql:/docker-entrypoint-initdb.d/tables_xxl_boot_modular_vue.sql:ro
      # 数据库持久化目录：建议自定义；
      - ${MYSQL_PATH}/conf:/etc/mysql/conf.d
      - ${MYSQL_PATH}/logs:/var/log/mysql
      - ${MYSQL_PATH}/data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-env-network

  redis:
    image: redis:8.2
    container_name: xxl-env-redis
    environment:
      # Redis配置：访问密码
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      # Redis持久化目录：建议自定义
      - ${REDIS_PATH}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; fi"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-env-network


networks:
  xxl-env-network:
    driver: bridge
